services:
  postgres:
      image: postgres:17
      restart: always
      environment:
        POSTGRES_PASSWORD: toor
        POSTGRES_USER: postgres
        POSTGRES_DB: journal
      ports:
        - "5433:5432"
      volumes:
        - postgres-data:/var/lib/postgresql/data
  
  api:
    build:
      context: ./server
      dockerfile: Dockerfile
    ports:
      - "5000:8080"
    environment:
      - DOTNET_ENVIRONMENT=Development
    env_file:
      - server/API/.env

  frontend:
    build: ./frontend
    container_name: app_frontend
    depends_on:
      - api
    environment:
      NEXT_PUBLIC_API_URL: http://backend:8080
    ports:
      - "3000:3000"

volumes:
  postgres-data: